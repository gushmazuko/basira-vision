<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <style>
    .io   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; rx: 10; }
    .stg  { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; rx: 10; }
    .t    { fill: #1f2328; font-size: 16px; font-weight: 600; text-anchor: middle; }
    .s    { fill: #59636e; font-size: 11.5px; text-anchor: middle; }
    .a    { stroke: #8b949e; stroke-width: 1.6; }
  </style>

  <!-- scanned pdf -->
  <rect x="15"  y="70" width="130" height="60" class="io"/>
  <text x="80"  y="96" class="t">Scanned PDF</text>
  <text x="80"  y="116" class="s">any language</text>

  <line x1="145" y1="100" x2="180" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- ocr stage -->
  <rect x="185" y="60" width="175" height="80" class="stg"/>
  <text x="272" y="92" class="t">ocr</text>
  <text x="272" y="112" class="s">vision OCR · Gemini</text>

  <line x1="360" y1="100" x2="395" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- markdown -->
  <rect x="400" y="70" width="130" height="60" class="io"/>
  <text x="465" y="96" class="t">markdown</text>
  <text x="465" y="116" class="s">page markers</text>

  <line x1="530" y1="100" x2="565" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- translate stage -->
  <rect x="570" y="60" width="195" height="80" class="stg"/>
  <text x="667" y="92" class="t">translate</text>
  <text x="667" y="112" class="s">sliding-window context</text>

  <line x1="765" y1="100" x2="800" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- translated md -->
  <rect x="805" y="70" width="135" height="60" class="io"/>
  <text x="872" y="96" class="t">translated md</text>
  <text x="872" y="116" class="s">your language</text>

  <line x1="940" y1="100" x2="975" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- typst stage -->
  <rect x="980" y="60" width="120" height="80" class="stg"/>
  <text x="1040" y="92" class="t">typst</text>
  <text x="1040" y="112" class="s">pandoc + typst</text>

  <line x1="1100" y1="100" x2="1130" y2="100" class="a" marker-end="url(#arr)"/>

  <!-- book pdf -->
  <rect x="1135" y="70" width="100" height="60" class="io"/>
  <text x="1185" y="96" class="t">Book PDF</text>
  <text x="1185" y="116" class="s">your template</text>
</svg>
